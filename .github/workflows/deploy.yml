name: Deploy

# Pushes to main deploy automatically. The workflow only finishes once the
# health check passes, so a green build means the site is actually serving.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest

    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      # Render's API is called from the job itself rather than from a build
      # hook, so the deploy is visible in the Actions log and retried with the
      # repository's own concurrency rules.
      - name: Trigger the deploy
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail

          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "::notice::Deploy skipped: RENDER_API_KEY or RENDER_SERVICE_ID is not set."
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          response=$(curl -sS -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "{\"serviceId\":\"$RENDER_SERVICE_ID\",\"clearCache\":\"do_not_clear\"}" \
            https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys)

          echo "$response" | head -c 500
          echo
          echo "url=" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Wait for the health check
        env:
          HEALTH_URL: ${{ vars.PUBLIC_URL }}
        run: |
          set -euo pipefail

          if [ -z "$HEALTH_URL" ]; then
            echo "::notice::PUBLIC_URL is not set; skipping the live check."
            exit 0
          fi

          # The deploy takes a couple of minutes to cycle. Poll rather than
          # sleeping a fixed amount, and fail loudly if it never comes up.
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "$HEALTH_URL/up" > /dev/null; then
              echo "Healthy after $((attempt * 20))s"
              exit 0
            fi
            sleep 20
          done

          echo "::error::The site did not become healthy in time"
          exit 1