name: CI

on:
  pull_request:
  push:
    branches: [ main, master ]

# A new push supersedes an in-flight run for the same ref: an old commit
# finishing late must never report on top of a newer one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luminara_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/luminara_test
      SECRET_KEY_BASE: ci-secret-key-base-not-used-for-anything-real-0000000000

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          # Pinned explicitly instead of being read from .ruby-version: a runner
          # image with no prebuilt build for the local Ruby fails this step
          # before a single test runs, which reads like a broken suite rather
          # than a toolchain gap. Override with a RUBY_VERSION repository
          # variable when the project moves forward.
          ruby-version: ${{ vars.RUBY_VERSION || '3.4.5' }}
          bundler-cache: true

      # `shell: bash` opts into `-o pipefail`. The default shell is `bash -e`,
      # where a pipeline reports the exit status of the *last* command: piping a
      # failing command into `tee` would turn a hard failure into a green step,
      # and the suite would then run against a database that was never created.
      - name: Prepare the database
        shell: bash
        run: bin/rails db:prepare

      - name: Run the test suite
        shell: bash
        run: |
          set +e
          bin/rails test > /tmp/test.log 2>&1
          status=$?
          cat /tmp/test.log
          if [ "$status" -ne 0 ]; then
            # Mirrored into an annotation: the job log is not retrievable
            # through the API, but annotations are, so a failure is diagnosable
            # without downloading artefacts by hand.
            echo "::error title=Backend suite::exit ${status}"
            tail -c 5000 /tmp/test.log
          fi
          exit "$status"

      - name: Confirm the autoloader agrees with the file layout
        run: bin/rails zeitwerk:check

      - name: Static analysis
        run: bin/brakeman --no-pager --quiet || true
        continue-on-error: true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build