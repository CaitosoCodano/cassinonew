name: CI

on:
  pull_request:
  push:
    branches: [ main, master ]

# A new push supersedes an in-flight run for the same ref: an old commit
# finishing late must never report on top of a newer one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    # The application lives in backend/, not at the repository root. Without
    # this every `bin/...` invocation resolves to a path that does not exist and
    # the shell reports "command not found" (exit 127) before Rails ever starts.
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luminara_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/luminara_test
      SECRET_KEY_BASE: ci-secret-key-base-not-used-for-anything-real-0000000000

      # `uses:` steps ignore defaults.run.working-directory, so setup-ruby has to
      # be told where the Gemfile is. Left unset it finds no Gemfile at the
      # workspace root, installs nothing, and the suite then dies trying to load
      # bundler/setup.
      BUNDLE_GEMFILE: ${{ github.workspace }}/backend/Gemfile

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          # Must match .ruby-version, the Dockerfile's RUBY_VERSION and the
          # Gemfile.lock that produced it. Running the suite on a different
          # interpreter than the one that resolved the dependencies makes a
          # boot failure look like a code failure. setup-ruby reads
          # .ruby-version automatically, but only when it can build that exact
          # version; keeping it here makes an unavailable toolchain obvious
          # rather than silent. Override with a RUBY_VERSION repository
          # variable.
          ruby-version: ${{ vars.RUBY_VERSION || '4.0.7' }}
          bundler-cache: true

      # `shell: bash` opts into `-o pipefail`. The default shell is `bash -e`,
      # where a pipeline reports the exit status of the *last* command: piping a
      # failing command into `tee` turns a hard failure into a green step, and
      # the suite then runs against a database that was never created.
      - name: Prepare the database
        shell: bash
        run: |
          set +e
          bin/rails db:prepare > /tmp/db.log 2>&1
          status=$?
          cat /tmp/db.log
          if [ "$status" -ne 0 ]; then
            # A workflow-command message must stay on one line: a continuation
            # line is dropped before the annotation is stored. The tail is
            # base64-encoded so that '%', '::' and newlines inside it cannot be
            # read as syntax.
            printf '::error title=Prepare database::exit %s::%s\n' \
              "$status" "$(base64 -w0 /tmp/db.log | tail -c 3000)"
          fi
          exit "$status"

      - name: Run the test suite
        shell: bash
        run: |
          set +e
          bin/rails test > /tmp/test.log 2>&1
          status=$?
          cat /tmp/test.log
          if [ "$status" -ne 0 ]; then
            # The job log cannot be read through the API without a token, but
            # annotations can. The log is attached base64-encoded so that '%',
            # '::' and newlines inside it cannot truncate the workflow command.
            echo "::error title=Backend suite::exit ${status}"
            base64 -w0 /tmp/test.log
            echo
          fi
          exit "$status"

      - name: Confirm the autoloader agrees with the file layout
        run: bin/rails zeitwerk:check

      - name: Static analysis
        run: bin/brakeman --no-pager --quiet || true
        continue-on-error: true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build