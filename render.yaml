# Render blueprint
#
# The whole product is one web service. Rails compiles nothing at boot: the
# build step compiles the client and copies it into the application's own
# public/, then Rails serves those static files and answers the API from the
# same process and the same origin.
#
# One origin is not a convenience here, it is a requirement. Session cookies are
# SameSite=Lax and the CSRF token travels on them, so a client served from one
# host talking to an API on another would be cross-site: browsers withhold the
# cookie and every request comes back unauthenticated. There is deliberately no
# second service to keep in step with this one.

services:
  - type: web
    name: luminara
    runtime: ruby
    # `free` sleeps after 15 minutes idle and takes roughly a minute to wake,
    # which is fine for evaluation and painful for real use. Change both this
    # and the database below to `starter` when the site is being used for real.
    plan: free
    region: oregon

    # Render builds from the repository root, but the Rails application lives in
    # backend/. Every path below is therefore relative to that directory.
    #
    # Migration and seeding run at the end of the BUILD command, not in a
    # pre-deploy command. Render only offers pre-deploy on paid plans, and this
    # blueprint targets the free one: declared and silently ignored, it would
    # let the first deploy through to an empty database -- no schema, no
    # administrator and no game catalogue, since the catalogue is seeded rather
    # than hard-coded.
    #
    # The trade-off is that migrations run before the new version is promoted
    # rather than alongside it. That is the safer direction anyway: a migration
    # that cannot apply fails the build instead of failing once the new code is
    # already live. Move this into preDeployCommand when the service is paid.
    buildCommand: >-
      cd backend &&
      bundle config set --local path vendor/bundle &&
      bundle install &&
      cd ../frontend && npm ci && npm run build &&
      rm -rf ../backend/public/assets ../backend/public/sfx &&
      cp -r dist/. ../backend/public/ &&
      cd ../backend && bin/rails db:prepare && bin/rails db:seed

    startCommand: cd backend && bin/rails server -b 0.0.0.0 -p $PORT

    healthCheckPath: /up

    envVars:
      - key: RAILS_ENV
        value: production

      - key: RAILS_LOG_TO_STDOUT
        value: "1"

      # Generated once and kept by Render across deploys. Setting it by hand in
      # the dashboard overrides this, which is the safer arrangement: an env
      # var defined in both places is reset from the dashboard on every build.
      - key: SECRET_KEY_BASE
        generateValue: true

      # Not set here on purpose. Render exports RENDER_EXTERNAL_URL to web
      # services, and the application reads it as the fallback for
      # WEB_CLIENT_URL, so the verification links in transactional email are
      # correct without anyone copying a hostname by hand. Set this only when a
      # custom domain is added, since RENDER_EXTERNAL_URL keeps pointing at the
      # onrender.com address.
      # - key: WEB_CLIENT_URL
      #   sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: luminara-db
          property: connectionString

      # No Redis. Rack::Attack falls back to an in-process store when REDIS_URL
      # is absent (see config/initializers/rack_attack.rb), which is correct for
      # a single instance. Add a `type: redis` resource and a REDIS_URL env var
      # here when running more than one instance, where rate-limit counters have
      # to be shared.
      # - key: REDIS_URL
      #   fromService:
      #     type: redis
      #     name: luminara-redis
      #     property: connectionString

      - key: WELCOME_BONUS_MINOR
        value: "100000"

      - key: PLAY_MONEY_CURRENCY
        value: VCR

      # Kept false: deposits and withdrawals return 501 until a licensed
      # payment integration exists. Do not enable without one.
      - key: REAL_MONEY_ENABLED
        value: "false"

      # Bootstrap administrator, consumed by db:seed. Set these in the
      # dashboard and mark them secret.
      #
      # The password is applied when the account is first created and is left
      # alone afterwards, so re-running the seeds cannot silently overwrite a
      # password changed in the admin area. Set ADMIN_PASSWORD_FORCE=1 to
      # reset one deliberately.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: luminara-db
    databaseName: luminara
    # Render's free PostgreSQL is deleted after 30 days. The ledger is
    # append-only and there is no export yet, so move this to `starter` before
    # the expiry date if the data is worth keeping.
    plan: free